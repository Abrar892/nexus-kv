[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-kv"
version = "0.1.0"
description = "High-performance in-memory key-value store and embedded cache server implementing the Redis (RESP) protocol with AOF persistence, transactions, and LRU/LFU eviction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Abrar892", email = "m.abrar.j40@gmail.com" }
]
keywords = [
    "in-memory-database",
    "key-value-store",
    "cache",
    "redis-compatible",
    "resp-protocol",
    "aof-persistence",
    "lru-eviction",
    "transactions"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: System :: Distributed Computing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License"
]

[project.scripts]
nexus-server = "nexus_kv.server:main"
nexus-cli = "nexus_kv.cli:main"
nexus-benchmark = "nexus_kv.benchmark:main"
